<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZAZOTHX-IPTRACE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      padding: 30px 20px;
      min-height: 100vh;
    }
    .wrap {
      max-width: 880px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.65);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .logo { font-size: 24px; font-weight: 700; color: #fff; }
    .clock {
      font-size: 13px;
      color: #fff;
      opacity: 0.6;
      background: rgba(0,0,0,0.4);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .prompt-row {
      display: flex;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.4);
      border-radius: 6px;
      margin-bottom: 14px;
    }
    .prompt-label {
      padding: 14px;
      color: #fff;
      opacity: 0.5;
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 14px;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
    }
    input::placeholder { color: rgba(255,255,255,0.3); }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    button, .chip {
      background: #1e4f33;
      border: none;
      padding: 12px 28px;
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover, .chip:hover { background: #2d7a4f; box-shadow: 0 0 18px #1e4f33; }
    .chip { padding: 10px 16px; border-radius: 20px; font-size: 12px; }
    #log {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.4);
      padding: 16px;
      border-radius: 6px;
      min-height: 70px;
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.8;
      color: rgba(255,255,255,0.7);
    }
    .result {
      margin-top: 28px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      overflow: hidden;
    }
    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .result-head .ip { font-size: 22px; font-weight: 700; color: #4dff88; }
    .badge {
      color: rgba(255,255,255,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 11px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(255,255,255,0.02);
    }
    .cell {
      padding: 14px 20px;
      background: rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .cell .k {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .cell .v {
      font-size: 15px;
      color: #fff;
      font-weight: 600;
      word-break: break-all;
    }
    .cell .v.green { color: #4dff88; }
    .cell .v.red { color: #ff5c5c; }
    .cell .v.yellow { color: #ffb454; }
    .footer {
      margin-top: 40px;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 18px;
      text-align: center;
    }
    .l-ok { color: #4dff88; }
    .l-warn { color: #ff5c5c; }
    .l-muted { color: rgba(255,255,255,0.4); }
    @media (max-width:640px){ .grid { grid-template-columns:1fr; } }

    #bgVideo {
      position: fixed; top:0; left:0;
      width:100%; height:100%;
      object-fit:cover;
      z-index:-1;
    }
    .audio-toggle {
      position: fixed; top:16px; left:16px; z-index:999;
      background:rgba(0,0,0,0.5);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:30px;
      padding:8px 14px;
      color:#fff;
      font-size:13px;
      font-family:'JetBrains Mono',monospace;
      cursor:pointer;
      backdrop-filter:blur(2px);
      display:flex;
      align-items:center;
      gap:6px;
    }
    .audio-toggle:hover { background:rgba(30,79,51,0.7); border-color:#1e4f33; }
    .audio-toggle .icon { font-size:16px; }
    @media (max-width:640px){ .audio-toggle { top:10px; left:10px; padding:6px 12px; font-size:11px; } }
  </style>
</head>
<body>
  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4">
  </video>
  <audio id="bgAudio" loop preload="auto" style="display:none;">
    <source src="Audio.mp3" type="audio/mpeg">
  </audio>
  <button class="audio-toggle" id="audioToggle">
    <span class="icon">🔊</span> <span id="audioLabel">On</span>
  </button>

<div class="wrap">
  <div class="header">
    <div class="logo">AZAZOTHX-IPTRACE</div>
    <div class="clock" id="clock">⏱️ --:-- WIB</div>
  </div>

  <div class="prompt-row">
    <span class="prompt-label">url&gt;</span>
    <input id="urlInput" placeholder="contoh.com" autocomplete="off">
  </div>
  <div class="actions">
    <button id="runBtn">🔍 TRACE + PORT SCAN</button>
    <button class="chip" data-fill="google.com">google.com</button>
    <button class="chip" data-fill="cloudflare.com">cloudflare.com</button>
  </div>

  <div id="log">⏳ sistem siap. masukkan domain & tekan TRACE.</div>

  <div class="result" id="result">
    <div class="result-head">
      <div class="ip" id="resIp">—</div>
      <div class="badge">LIVE DATA</div>
    </div>
    <div class="grid">
      <div class="cell"><div class="k">Resolved IP</div><div class="v" id="resRealIp">—</div></div>
      <div class="cell"><div class="k">Network / ASN</div><div class="v" id="resAsn">—</div></div>
      <div class="cell"><div class="k">Provider</div><div class="v" id="resProvider">—</div></div>
      <div class="cell"><div class="k">Country</div><div class="v" id="resCountry">—</div></div>
      <div class="cell"><div class="k">City</div><div class="v" id="resCity">—</div></div>
      <div class="cell"><div class="k">Cloudflare</div><div class="v" id="resCf">—</div></div>
      <div class="cell"><div class="k">Origin exposed</div><div class="v" id="resExposed">—</div></div>
      <div class="cell"><div class="k">Confidence</div><div class="v" id="resConfidence">—</div></div>
    </div>
  </div>
  <div class="footer">data real — API by Vercel</div>
</div>

<script>
  // ======== CLOCK ========
  const clockEl = document.getElementById('clock');
  setInterval(() => {
    const now = new Date();
    const wib = new Date(now.getTime() + 7 * 60 * 60 * 1000);
    clockEl.textContent = '⏱️ ' + wib.toISOString().slice(11, 19) + ' WIB';
  }, 1000);

  // ======== LOG ========
  const log = document.getElementById('log');
  function logLine(msg, cls='') {
    const line = document.createElement('div');
    line.className = 'line ' + cls;
    line.textContent = msg;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  // ======== DOM ========
  const input = document.getElementById('urlInput');
  const runBtn = document.getElementById('runBtn');
  document.querySelectorAll('.chip').forEach(c => {
    c.onclick = () => { input.value = c.dataset.fill; input.focus(); };
  });

  // ======== API ========
  const API_BASE = 'https://beckend-iptrace.vercel.app/api/lookup';

  async function runLookup() {
    const domain = input.value.trim().replace(/^https?:\/\//, '').split('/')[0];
    if (!domain) { logLine('[!] masukkan domain dulu', 'l-warn'); return; }

    log.innerHTML = '';
    runBtn.disabled = true;
    runBtn.textContent = '⏳ LOOKUP...';

    try {
      const res = await fetch(`${API_BASE}?domain=${domain}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      logLine('[+] berhasil mengambil data', 'l-ok');

      // ========== ORIGIN EXPOSED ==========
      const exposed = data.origin_ip && data.origin_ip !== 'tidak ditemukan' ? 'YES' : 'NO';

      // ========== ISI RESULT ==========
      document.getElementById('resIp').textContent = data.origin_ip || '—';
      document.getElementById('resRealIp').textContent = data.origin_ip || '—';
      document.getElementById('resAsn').textContent = data.asn || data.org || '—';
      document.getElementById('resProvider').textContent = data.isp || data.org || '—';
      document.getElementById('resCountry').textContent = data.country || '—';
      document.getElementById('resCity').textContent = data.city || '—';
      
      const cfEl = document.getElementById('resCf');
      cfEl.textContent = data.cloudflare_detected ? 'YES' : 'NO';
      cfEl.className = 'v ' + (data.cloudflare_detected ? 'yellow' : 'green');

      const expEl = document.getElementById('resExposed');
      expEl.textContent = exposed;
      expEl.className = 'v ' + (exposed === 'YES' ? 'green' : 'red');

      const confEl = document.getElementById('resConfidence');
      const confidence = data.confidence || (data.origin_ip && data.origin_ip !== 'tidak ditemukan' ? 'MEDIUM' : 'LOW');
      confEl.textContent = confidence;
      confEl.className = 'v ' + (confidence === 'HIGH' ? 'green' : confidence === 'MEDIUM' ? 'yellow' : 'red');

      // ========== LOG TAMBAHAN ==========
      if (data.discovered_ips?.length > 0) {
        logLine(`[+] total IP ditemukan: ${data.discovered_ips.length}`, 'l-muted');
      }
      const srcList = data.sources ? Object.keys(data.sources).filter(k => data.sources[k]?.length > 0) : [];
      if (srcList.length > 0) logLine(`[+] sumber: ${srcList.join(', ')}`, 'l-muted');

    } catch (err) {
      logLine('[!] gagal: ' + err.message, 'l-warn');
    }

    runBtn.disabled = false;
    runBtn.textContent = '🔍 TRACE + PORT SCAN';
  }

  runBtn.onclick = runLookup;
  input.onkeydown = e => { if(e.key === 'Enter') runLookup(); };
  logLine('💡 ketik domain & tekan enter', 'l-muted');

  // ======== AUDIO ========
  const bgAudio = document.getElementById('bgAudio');
  const audioToggle = document.getElementById('audioToggle');
  const audioLabel = document.getElementById('audioLabel');

  function playAudio() {
    bgAudio.play().then(() => {
      audioLabel.textContent = 'On';
      audioToggle.querySelector('.icon').textContent = '🔊';
    }).catch(() => {
      audioLabel.textContent = 'Off';
      audioToggle.querySelector('.icon').textContent = '🔇';
    });
  }

  window.addEventListener('load', () => { playAudio(); });
  document.addEventListener('click', function firstClick() {
    if (bgAudio.paused) playAudio();
    document.removeEventListener('click', firstClick);
  });
  audioToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bgAudio.paused) playAudio();
    else { bgAudio.pause(); audioLabel.textContent='Off'; audioToggle.querySelector('.icon').textContent='🔇'; }
  });
</script>
</body>
</html>
